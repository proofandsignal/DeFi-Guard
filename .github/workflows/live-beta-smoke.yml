name: DeFi Guard Live Beta Smoke

on:
  workflow_run:
    workflows:
      - Deploy DeFi Guard to Cloudflare
    types:
      - completed
  workflow_dispatch:
    inputs:
      wallet:
        description: "Public Ethereum wallet with an active Aave v3 position"
        required: false
        default: "0x7a447c0a0ca7a786224bc2d27347b257e246eb1d"

permissions:
  contents: read

jobs:
  live-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GUARD_URL: "https://defi-guard.digitaldragoworkspace.workers.dev"
      WEBHOOK_SINK_URL: "https://defi-guard-webhook-sink.digitaldragoworkspace.workers.dev/hook"
      RISK_MONITOR_URL: "https://defi-risk-monitor-api.onrender.com"
      DEFAULT_WALLET: "0x7a447c0a0ca7a786224bc2d27347b257e246eb1d"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Resolve wallet
        id: wallet
        env:
          INPUT_WALLET: ${{ inputs.wallet }}
        shell: bash
        run: |
          WALLET="$INPUT_WALLET"
          if [ -z "$WALLET" ]; then
            WALLET="$DEFAULT_WALLET"
          fi
          echo "wallet=$WALLET" >> "$GITHUB_OUTPUT"

      - name: Preflight live Aave position
        env:
          WALLET: ${{ steps.wallet.outputs.wallet }}
        run: |
          node <<'NODE'
          const wallet = process.env.WALLET;
          const url = `${process.env.RISK_MONITOR_URL}/api/v1/aave/account/${wallet}`;
          const response = await fetch(url);
          const text = await response.text();
          if (!response.ok) throw new Error(`risk_monitor_http_${response.status}:${text.slice(0,300)}`);
          const body = JSON.parse(text);
          const s = body.snapshot;
          if (!s) throw new Error("snapshot_missing");
          if (!(Number(s.totalDebtBase) > 0)) throw new Error("wallet_has_no_active_aave_debt");
          if (!Number.isFinite(Number(s.healthFactor))) throw new Error("health_factor_missing");
          console.log(JSON.stringify({
            wallet: s.wallet,
            chainId: s.chainId,
            totalCollateralBase: s.totalCollateralBase,
            totalDebtBase: s.totalDebtBase,
            healthFactor: s.healthFactor,
            observedAt: s.observedAt
          }));
          NODE

      - name: Create live beta watchlist and position
        id: bootstrap
        env:
          WALLET: ${{ steps.wallet.outputs.wallet }}
        run: |
          node <<'NODE'
          const fs = await import('node:fs');
          const crypto = await import('node:crypto');

          const ownerKey = crypto.randomBytes(32).toString('hex');
          console.log(`::add-mask::${ownerKey}`);

          const headers = {
            'content-type': 'application/json',
            'x-guard-owner-key': ownerKey
          };

          const watchlistResponse = await fetch(`${process.env.GUARD_URL}/api/v1/watchlists`, {
            method: 'POST',
            headers,
            body: JSON.stringify({ label: 'BUILD-008 Live Aave Smoke' })
          });
          const watchlistText = await watchlistResponse.text();
          if (!watchlistResponse.ok) {
            throw new Error(`watchlist_http_${watchlistResponse.status}:${watchlistText.slice(0,300)}`);
          }
          const watchlist = JSON.parse(watchlistText);

          const positionResponse = await fetch(`${process.env.GUARD_URL}/api/v1/watchlists/${watchlist.id}/positions`, {
            method: 'POST',
            headers,
            body: JSON.stringify({
              walletAddress: process.env.WALLET,
              protocol: 'aave-v3',
              chain: 'ethereum',
              asset: 'ACCOUNT'
            })
          });
          const positionText = await positionResponse.text();
          if (!positionResponse.ok) {
            throw new Error(`position_http_${positionResponse.status}:${positionText.slice(0,300)}`);
          }
          const position = JSON.parse(positionText);

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `watchlist_id=${watchlist.id}\nposition_id=${position.id}\nowner_key=${ownerKey}\n`
          );

          console.log(JSON.stringify({
            watchlistId: watchlist.id,
            positionId: position.id,
            walletAddress: position.walletAddress,
            protocol: position.protocol,
            chain: position.chain,
            asset: position.asset
          }));
          NODE

      - name: Wait for cron and verify latest snapshot through Guard API
        env:
          POSITION_ID: ${{ steps.bootstrap.outputs.position_id }}
          OWNER_KEY: ${{ steps.bootstrap.outputs.owner_key }}
        run: |
          node <<'NODE'
          const positionId = process.env.POSITION_ID;
          const ownerKey = process.env.OWNER_KEY;
          const url = `${process.env.GUARD_URL}/api/v1/positions/${positionId}/snapshots/latest`;

          const maxAttempts = 20;
          for (let attempt = 1; attempt <= maxAttempts; attempt++) {
            const response = await fetch(url, {
              headers: { 'x-guard-owner-key': ownerKey }
            });
            const text = await response.text();

            if (!response.ok) {
              throw new Error(`guard_latest_snapshot_http_${response.status}:${text.slice(0,300)}`);
            }

            const body = JSON.parse(text);
            if (body.data) {
              const s = body.data;
              console.log(JSON.stringify({
                positionId: s.positionId,
                observedAt: s.observedAt,
                alertState: s.alertState,
                healthFactor: s.healthFactor,
                createdAt: s.createdAt
              }));

              if (s.positionId !== positionId) throw new Error('snapshot_position_mismatch');
              if (!s.observedAt) throw new Error('snapshot_observed_at_missing');
              if (!s.createdAt) throw new Error('snapshot_created_at_missing');
              process.exit(0);
            }

            console.log(`No scheduled snapshot yet (attempt ${attempt}/${maxAttempts}); waiting 30s...`);
            await new Promise(resolve => setTimeout(resolve, 30_000));
          }

          throw new Error('scheduled_snapshot_not_persisted_within_10_minutes');
          NODE


      - name: Add webhook destination
        env:
          WATCHLIST_ID: ${{ steps.bootstrap.outputs.watchlist_id }}
          OWNER_KEY: ${{ steps.bootstrap.outputs.owner_key }}
        run: |
          node <<'NODE'
          const response=await fetch(
            `${process.env.GUARD_URL}/api/v1/watchlists/${process.env.WATCHLIST_ID}/destinations`,
            {
              method:'POST',
              headers:{
                'content-type':'application/json',
                'x-guard-owner-key':process.env.OWNER_KEY
              },
              body:JSON.stringify({
                channel:'webhook',
                target:process.env.WEBHOOK_SINK_URL
              })
            }
          );
          const text=await response.text();
          if(!response.ok) throw new Error(`destination_http_${response.status}:${text.slice(0,300)}`);
          console.log(text);
          NODE

      - name: Seed controlled WARNING state
        env:
          POSITION_ID: ${{ steps.bootstrap.outputs.position_id }}
          OWNER_KEY: ${{ steps.bootstrap.outputs.owner_key }}
        run: |
          node <<'NODE'
          const response=await fetch(
            `${process.env.GUARD_URL}/api/v1/positions/${process.env.POSITION_ID}/snapshots`,
            {
              method:'POST',
              headers:{
                'content-type':'application/json',
                'x-guard-owner-key':process.env.OWNER_KEY
              },
              body:JSON.stringify({
                healthFactor:1.10,
                collateralValueUsd:100000,
                debtValueUsd:60000,
                ltvPct:60,
                liquidationThresholdPct:80,
                dataState:'SUFFICIENT',
                updatedAt:new Date().toISOString()
              })
            }
          );
          const text=await response.text();
          if(!response.ok) throw new Error(`seed_warning_http_${response.status}:${text.slice(0,300)}`);
          const body=JSON.parse(text);
          if(body.snapshot?.alertState!=='WARNING'){
            throw new Error(`controlled_warning_not_created:${text.slice(0,300)}`);
          }
          console.log(JSON.stringify({
            alertState:body.snapshot.alertState,
            eventType:body.change?.eventType,
            controlled:true
          }));
          NODE

      - name: Wait for cron and verify webhook delivery
        id: delivery
        env:
          POSITION_ID: ${{ steps.bootstrap.outputs.position_id }}
          OWNER_KEY: ${{ steps.bootstrap.outputs.owner_key }}
        run: |
          node <<'NODE'
          const fs=await import('node:fs');
          const headers={'x-guard-owner-key':process.env.OWNER_KEY};
          const url=`${process.env.GUARD_URL}/api/v1/positions/${process.env.POSITION_ID}/deliveries`;

          for(let attempt=1; attempt<=14; attempt++){
            const response=await fetch(url,{headers});
            const text=await response.text();
            if(!response.ok) throw new Error(`deliveries_http_${response.status}:${text.slice(0,300)}`);

            const deliveries=JSON.parse(text).data || [];
            const sent=deliveries.find(d =>
              d.channel==='webhook' &&
              d.status==='SENT' &&
              d.eventType==='RISK_IMPROVED' &&
              d.previousState==='WARNING' &&
              d.currentState==='OK' &&
              String(d.providerMessageId || '').startsWith('sink-')
            );

            if(sent){
              console.log(JSON.stringify({
                deliveryId:sent.id,
                status:sent.status,
                eventType:sent.eventType,
                previousState:sent.previousState,
                currentState:sent.currentState,
                providerMessageId:sent.providerMessageId,
                targetHint:sent.targetHint
              }));
              fs.appendFileSync(process.env.GITHUB_OUTPUT,`delivery_count=${deliveries.length}\n`);
              process.exit(0);
            }

            console.log(`No successful webhook yet (attempt ${attempt}/14); waiting 30s...`);
            await new Promise(resolve=>setTimeout(resolve,30000));
          }

          throw new Error('webhook_delivery_not_confirmed_within_7_minutes');
          NODE

      - name: Verify next unchanged cron stays silent
        env:
          POSITION_ID: ${{ steps.bootstrap.outputs.position_id }}
          OWNER_KEY: ${{ steps.bootstrap.outputs.owner_key }}
          DELIVERY_COUNT: ${{ steps.delivery.outputs.delivery_count }}
        run: |
          sleep 330
          node <<'NODE'
          const response=await fetch(
            `${process.env.GUARD_URL}/api/v1/positions/${process.env.POSITION_ID}/deliveries`,
            {headers:{'x-guard-owner-key':process.env.OWNER_KEY}}
          );
          const text=await response.text();
          if(!response.ok) throw new Error(`deliveries_http_${response.status}:${text.slice(0,300)}`);
          const deliveries=JSON.parse(text).data || [];
          const before=Number(process.env.DELIVERY_COUNT);
          if(deliveries.length!==before){
            throw new Error(`duplicate_delivery_detected:before=${before},after=${deliveries.length}`);
          }
          console.log(JSON.stringify({
            deliveriesBefore:before,
            deliveriesAfter:deliveries.length,
            duplicateDeliveries:0,
            unchangedCronSilent:true
          }));
          NODE
